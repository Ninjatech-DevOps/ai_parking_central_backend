services:
  app:
    build: .
    container_name: ai_parking_api
    restart: unless-stopped
    ports:
      - "${APP_HOST_PORT:-8100}:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./alembic:/app/alembic
      - ./logs:/app/logs

  celery_worker:
    build: .
    container_name: ai_parking_celery_worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    command: celery -A src.celery_app worker --loglevel=info --concurrency=4

  celery_beat:
    build: .
    container_name: ai_parking_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    command: celery -A src.celery_app beat --loglevel=info

  db:
    image: timescale/timescaledb:latest-pg16
    container_name: ai_parking_db
    restart: unless-stopped
    ports:
      - "${DB_HOST_PORT:-5480}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-ai_parking}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ai_parking_pass}
      POSTGRES_DB: ${DB_NAME:-ai_parking_central}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ai_parking} -d ${DB_NAME:-ai_parking_central}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai_parking_redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6390}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
