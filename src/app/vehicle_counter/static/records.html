<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f8fb">
<title>Vehicle Records</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/vehicle-counter/static/app.css?v=1">
</head>
<body>

<header class="hdr">
  <div class="brand"><span class="brand-dot"></span> Vehicle Records</div>
  <nav class="nav">
    <a href="/vehicle-counter/">Counter</a>
    <a href="/vehicle-counter/records" class="active">Records</a>
  </nav>
</header>

<main class="wrap wrap-wide">

  <div id="banner"></div>

  <section class="stats">
    <div class="tile tile-in">
      <div class="tile-val" id="stat-in">—</div>
      <div class="tile-label">Total In</div>
    </div>
    <div class="tile tile-out">
      <div class="tile-val" id="stat-out">—</div>
      <div class="tile-label">Total Out</div>
    </div>
    <div class="tile tile-inside">
      <div class="tile-val" id="stat-inside">—</div>
      <div class="tile-label">Inside</div>
    </div>
  </section>

  <div class="toolbar">
    <h2 class="section-label toolbar-title">All entries — newest first</h2>
    <button class="btn btn-primary" id="open-export" type="button" hidden>
      <span aria-hidden="true">↓</span> Export Excel
    </button>
  </div>

  <div class="card">
    <table class="resp">
      <thead>
        <tr>
          <th>#</th>
          <th>Direction</th>
          <th>In</th>
          <th>Out</th>
          <th>Plate</th>
          <th>Time</th>
          <th id="th-actions" hidden></th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="7" class="empty">Loading…</td></tr>
      </tbody>
    </table>

    <div class="pager" id="pager" hidden>
      <span class="pager-info" id="pager-info"></span>
      <span class="pager-btns">
        <button class="btn" id="prev" type="button">Previous</button>
        <button class="btn" id="next" type="button">Next</button>
      </span>
    </div>
  </div>

</main>

<div class="modal" id="export-modal" hidden>
  <div class="modal-backdrop" data-close-export></div>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="export-title">
    <div class="modal-head">
      <h3 class="modal-title" id="export-title">Export to Excel</h3>
      <button class="modal-x" type="button" data-close-export aria-label="Close">×</button>
    </div>

    <p class="modal-hint">
      Choose a date and time range. Leave a field empty for no limit.
      Entries are exported oldest first.
    </p>

    <div class="field-grid">
      <label class="field">
        <span class="field-label">From</span>
        <input type="datetime-local" id="export-from" step="1">
      </label>
      <label class="field">
        <span class="field-label">To</span>
        <input type="datetime-local" id="export-to" step="1">
      </label>
    </div>

    <div class="quick-picks">
      <button class="chip" type="button" data-range="today">Today</button>
      <button class="chip" type="button" data-range="7">Last 7 days</button>
      <button class="chip" type="button" data-range="30">Last 30 days</button>
      <button class="chip" type="button" data-range="all">All time</button>
    </div>

    <div class="modal-foot">
      <button class="btn" type="button" data-close-export>Cancel</button>
      <button class="btn btn-primary" id="do-export" type="button">Download .xlsx</button>
    </div>
  </div>
</div>

<div id="toasts" aria-live="polite"></div>

<script src="/vehicle-counter/static/common.js?v=1"></script>
<script src="/vehicle-counter/static/records.js?v=1"></script>
</body>
</html>
